<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#071B2D" />
  <title>ElimQuest — offline</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #071B2D; color: #f6f0e1; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; padding: 24px; }
    main { max-width: 26rem; }
    h1 { font: 600 1.9rem/1.2 Georgia, "Times New Roman", serif; margin: 0 0 .5rem; }
    p { color: #d8d3c4; margin: 0 0 1.25rem; }
    button { min-height: 48px; padding: 0 1.5rem; border: 0; border-radius: 12px; background: #f2b858; color: #071B2D; font: 600 1rem system-ui, sans-serif; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <h1>You’re offline</h1>
    <p>ElimQuest needs an internet connection to load questions and play with friends. Check your connection, then try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
